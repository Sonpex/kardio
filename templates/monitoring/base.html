<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System monitorowania kardiologicznego</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f7f3f8; color: #2b2131; }
        header { background: #4f2f56; color: white; padding: 18px 28px; }
        nav a { color: white; text-decoration: none; margin-right: 14px; font-weight: 600; }
        main { padding: 28px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 14px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); padding: 24px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .menu-box { background: #fff; border-left: 5px solid #c55fdc; border-radius: 12px; padding: 18px; }
        .menu-box h3 { margin-top: 0; }
        a.button, button { display: inline-block; background: #7c3e88; color: white; padding: 10px 16px; border: none; border-radius: 10px; text-decoration: none; cursor: pointer; }
        a.secondary { background: #a56ab0; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; background: white; }
        th, td { border-bottom: 1px solid #eadff0; padding: 10px; text-align: left; }
        th { background: #f0e6f4; }
        form p { margin-bottom: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #d6c3df; box-sizing: border-box; }
        .errorlist { color: #b00020; }
        .actions { margin: 12px 0 18px; display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>
    <header>
        <h1>System monitorowania kardiologicznego</h1>
        <nav>
            <a href="/">Start</a>
            <a href="/lekarze/">Lekarze</a>
            <a href="/pacjenci/">Pacjenci</a>
            <a href="/urzadzenia/">Urządzenia</a>
            <a href="/pomiary/">Pomiary</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
